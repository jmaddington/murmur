name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          rustup default stable
          brew install create-dmg
          swift --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
            .build
          key: ${{ runner.os }}-build-${{ hashFiles('core/Cargo.lock', 'Package.swift') }}

      - name: Rust unit tests
        run: cd core && cargo test --release

      - name: Build app
        run: ./scripts/build.sh

      - name: End-to-end tests
        env:
          # Optional: set this secret to also run the live OpenRouter cases (costs a few cents).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_E2E_KEY }}
        run: ./tests/e2e/run.sh build/e2e

      - name: Package (unsigned smoke test)
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-and-screenshots
          path: |
            build/e2e/report.json
            build/e2e/log.txt
            build/e2e/screenshots
