name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="$INPUT_VERSION"
          [[ -z "$V" ]] && V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error title=Bad version::'$V' is not semver"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Toolchains
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          rustup default stable
          brew install create-dmg

      # Tests run before any certificates touch the keychain: the e2e harness
      # writes throwaway Keychain items and must never meet a signing keychain.
      - name: Test
        timeout-minutes: 15
        run: |
          (cd core && cargo test --release)
          ./tests/e2e/run.sh build/e2e

      - name: Import signing certificates
        env:
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_APP_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_PASSWORD }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          DEVELOPER_ID_INSTALLER_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: scripts/ci/import-certs.sh

      # AIDEV-NOTE: package.sh silently skips notarization/PKG signing without creds; a release must never ship that.
      - name: Require full signing setup
        run: |
          missing=()
          [[ -n "${MURMUR_INSTALLER_IDENTITY:-}" ]] || missing+=("Developer ID Installer identity")
          [[ -n "${NOTARY_KEY_PATH:-}" ]] || missing+=("notary API key (ASC_API_KEY_*)")
          if (( ${#missing[@]} )); then
            echo "::error title=Incomplete signing setup::Missing: ${missing[*]}. Refusing to publish an unnotarized release."
            exit 1
          fi

      - name: Build, sign, package, notarize
        timeout-minutes: 30
        run: |
          ./scripts/build.sh
          ./scripts/package.sh

      - name: Verify
        run: |
          codesign --verify --deep --strict --verbose=2 build/Murmur.app
          spctl --assess --type execute -v build/Murmur.app || echo "::warning::Gatekeeper assessment failed (unsigned build?)"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Murmur $VERSION" --generate-notes
          gh release upload "$TAG" build/dist/* --clobber

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/murmur-signing.keychain-db" || true
